for(let i=0;i<12;i++){let n=new Date(y,i+1,0).getDate(),ld=(new Date(y,i,1).getDay()+6)%7;
o+=`<div class="mn ${y==now.getFullYear()&&i==now.getMonth()?'cm':''}"><small data-a=gm data-i=${i}>${MON[i]}</small><div class=mg>${'<i class=e></i>'.repeat(ld)}`;
for(let d=1;d<=n;d++){const k=K(new Date(y,i,d));o+=`<i class="y ${k==T?'td':''}">${dl(k).map(h=>`<b style="background:${h.c}"></b>`).join('')}</i>`};o+=`</div></div>`}
return o+`</div>`}
let n=new Date(y,m+1,0).getDate(),ld=(new Date(y,m,1).getDay()+6)%7;
o+=`<div class=nv><button data-a=nav data-d=-1>${ic('l',18)}</button><b>${MON[m]} ${y}</b><button data-a=nav data-d=1>${ic('r',18)}</button></div><div class=wd>${['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(x=>`<div>${x}</div>`).join('')}</div><div class=mg>${'<div></div>'.repeat(ld)}`;
for(let d=1;d<=n;d++){let k=K(new Date(y,m,d));o+=`<div class="d ${k==T?'td':''} ${k==sel?'sl':''}" data-a=sel data-k=${k}>${d}<div class=sq>${dl(k).map(h=>`<i style="background:${h.c};box-shadow:0 0 6px ${h.c}"></i>`).join('')}</div></div>`}
o+=`</div>`;
if(sel&&S.h.length)o+=`<div class=card style=margin-top:12px><h3>${sel.split('-').reverse().join('.')}</h3><div class=ch style=flex-wrap:wrap>${S.h.map(h=>`<button class="c ${done(h,sel)?'on':''}" style="--c:${h.c}" data-a=dt data-i=${h.id}>${esc(h.n)}</button>`).join('')}</div><small>Dotknij, żeby zaznaczyć lub cofnąć ten dzień.</small></div>`;
return o}
function vGoals(){let t=new Date(),o=`<div class="card stt" style=margin-top:0><span style=color:#ff8a3d>${ic('fl')} seria ${streak()}</span><span style=color:#ffd23f>${ic('co')} ${S.c}</span></div>`;
if(!S.h.length)return o+`<div class=card><small>Nie masz jeszcze postanowień. Dodaj je w zakładce Postanowienia.</small></div>`;
[['d','Dziś'],['w','W tym tygodniu'],['m','W tym miesiącu']].forEach(([f,l])=>{let a=S.h.filter(h=>h.f==f);if(!a.length)return;o+=`<div class=gh>${l}</div>`+a.map(h=>{let p=pdone(h,t);return `<div class=row data-a=gt data-i=${h.id}><i class="bx ${p?'on':''}" style="--c:${h.c}">${p?ic('ck',18):''}</i><span>${esc(h.n)}</span></div>`}).join('')});
return o+`<small>Za każde odhaczenie dostajesz 5 monet na ubranka dla zwierzaka.</small>`}
function vHab(){return `<div class=card><h3>Nowe postanowienie</h3><input id=nn placeholder="Np. ćwiczenia, woda, czytanie" value="${esc(nn)}"><div class=seg>${Object.entries(FQ).map(([k,l])=>`<button class="${nf==k?'on':''}" data-a=nf data-k=${k}>${l}</button>`).join('')}</div><div class=sw>${COL.map(c=>`<button class="${nc==c?'on':''}" style="background:${c};box-shadow:0 0 12px ${c}" data-a=nc data-c="${c}"></button>`).join('')}</div><button class=bt data-a=add>Dodaj</button></div>`
+S.h.map(h=>`<div class=row><i class="bx on" style="--c:${h.c}"></i><span>${esc(h.n)}<br><small>${FQ[h.f]}</small></span><button data-a=del data-i=${h.id}>${ic('x',20)}</button></div>`).join('')}
function vSet(){return `<div class=card><h3>Motyw</h3><div class=seg style=margin:0>${[['dark','Ciemny'],['light','Jasny'],['auto','Auto']].map(([k,l])=>`<button class="${(S.th||'dark')==k?'on':''}" data-a=th data-t=${k}>${l}</button>`).join('')}</div></div><div class=card><h3>Zwierzak</h3><button class=bt2 data-a=reset>Zmień zwierzaka</button><small>Monety i kupione ubranka zostają.</small></div><div class=card><h3>Kopia danych</h3><div class=two style=margin:0><button class=bt2 data-a=exp>Kopiuj</button><button class=bt2 data-a=imp>Wczytaj</button></div></div>`}
function vAdopt(){return `<div class=card><h3>Adoptuj zwierzaka</h3><div class=pg>${Object.keys(PC).map(k=>`<button class="pk ${sk==k?'on':''}" data-a=sk data-k=${k}><svg class="ps still" viewBox="0 -4 16 20">${petSvg(k,sc,{})}</svg><small>${NM[k]}</small></button>`).join('')}</div><div class=sw>${PC[sk].map((c,i)=>`<button class="${sc==i?'on':''}" style="background:${c.b}" data-a=cl data-i=${i}></button>`).join('')}</div><input id=pn placeholder="Imię zwierzaka" maxlength=16 value="${esc(pn)}"><button class=bt data-a=pick>Adoptuj</button></div>`}
function scene(s,fl){const p=S.p,k=(5+Math.min(s,40)*.09).toFixed(2);
return `<svg class=sc viewBox="0 0 320 250"><rect class=wl width=320 height=190 /><rect class=fl y=190 width=320 height=60 /><rect class=wn x=26 y=28 width=76 height=76 rx=12 /><path d="M64 28v76M26 66h76" stroke="var(--wl)" stroke-width=4 /><circle cx=82 cy=48 r=9 fill=#ffd23f /><ellipse class=rg cx=150 cy=226 rx=100 ry=16 />
<rect class=hs x=238 y=142 width=68 height=54 rx=5 /><path d="M228 146l44-42 44 42z" fill=#ff4fa8 /><path d="M260 196v-22a12 12 0 0 1 24 0v22z" fill=#2b1b3d /><circle cx=272 cy=128 r=6 fill=#fff3b0 />
<path d="M34 222h46l-6 18H40z" fill=#ff2bd6 /><path d="M42 222a5 5 0 1 1 8 0M56 221a5 5 0 1 1 9 0" fill=#b5651d />${fl>35?'<circle cx=48 cy=221 r=4 fill=#b5651d /><circle cx=58 cy=219 r=4 fill=#c9803a /><circle cx=67 cy=221 r=4 fill=#b5651d />':''}
<g data-a=pet style=cursor:pointer><g transform="translate(150 232)"><g class=wd2><g transform="scale(${k}) translate(-8 -16)"><g class=bob id=pg>${petSvg(p.k,p.ci,p.w)}</g></g></g></g></g></svg>`}
function vHome(){const p=S.p,s=streak(),fl=full(),st=s<3?'Maluszek':s<10?'Podrostek':s<30?'Dorosły':'Legenda';
return `<div class="card sceneC">${scene(s,fl)}</div><div class=card style=text-align:center><h3 data-a=rn style=margin-bottom:2px>${esc(p.n)}</h3><small>${NM[p.k]} · ${st} · ${fl<30?'jest głodny':fl<70?'w dobrej formie':'najedzony i szczęśliwy'}</small><div class=bar><i style="width:${fl}%"></i></div><div class=stt><span style=color:#ff8a3d>${ic('fl')} ${s}</span><span style=color:#ffd23f>${ic('co')} ${S.c}</span><span style=color:#ff4fa8>${ic('ht')} <b id=lv>${p.love}</b></span></div><div class=two><button class=bt data-a=pet>${ic('ht',18)} Głaszcz</button><button class=bt data-a=feed>${ic('bw',18)} Nakarm · 5</button></div></div>${demo()}`}
function vShop(){const p=S.p;let o=`<div class=card style="display:flex;justify-content:space-between;align-items:center"><h3 style=margin:0>Sklep</h3><b style=color:#ffd23f>${ic('co',18)} ${S.c}</b></div>`;
[['h','Na głowę'],['f','Na twarz'],['n','Na szyję']].forEach(([s,l])=>{o+=`<div class=gh>${l}</div><div class=sh>${SHOP.filter(x=>x.s==s).map(x=>{const own=p.o.includes(x.id),on=p.w[s]==x.id;return `<div class="it ${on?'on':''}" data-a=shop data-i=${x.id}><svg class="ps still" viewBox="0 -4 16 20">${petSvg(p.k,p.ci,{[s]:x.id})}</svg><small>${x.n}</small><b>${on?'Założone':own?'Założ':ic('co',14)+' '+x.p}</b></div>`}).join('')}</div>`});return o}
function vPet(){if(!S.p.k)return vAdopt();return `<div class=seg><button class="${PT=='home'?'on':''}" data-a=pt data-t=home>${ic('hm',18)}Dom</button><button class="${PT=='shop'?'on':''}" data-a=pt data-t=shop>${ic('bg',18)}Sklep</button></div>`+(PT=='home'?vHome():vShop())}
function R(){$('#m').innerHTML={cal:vCal,goals:vGoals,habits:vHab,pet:vPet,set:vSet}[V]();$('#t').textContent=TT[V];if(V=='cal'&&M=='y'&&yf){yf=0;const e=$('.mn.cm');if(e)e.scrollIntoView({block:'center'})}document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.v==V))}
const act={
v:d=>{V=d.v;yf=1;R()},mode:d=>{M=d.m;yf=1;R()},fa:()=>{F=[];R()},ff:d=>{F=F.includes(d.i)?F.filter(x=>x!=d.i):[...F,d.i];R()},
nav:d=>{M=='y'?cur.setFullYear(cur.getFullYear()+ +d.d):cur.setMonth(cur.getMonth()+ +d.d);R()},gm:d=>{cur.setMonth(+d.i);M='m';R()},
sel:d=>{sel=sel==d.k?null:d.k;R()},dt:d=>{tog(d.i,sel);R()},
gt:d=>{let h=S.h.find(x=>x.id==d.i),t=new Date();if(pdone(h,t))per(h.f,t).forEach(k=>{if(done(h,k))tog(h.id,k)});else tog(h.id,K(t));R()},
nf:d=>{nf=d.k;R()},nc:d=>{nc=d.c;R()},
add:()=>{nn=nn.trim();if(!nn)return toast('Wpisz nazwę');S.h.push({id:Date.now().toString(36),n:nn,f:nf,c:nc});nn='';save();R()},
del:d=>{ask('Usunąć postanowienie? Zaznaczenia w kalendarzu też znikną.',0,()=>{S.h=S.h.filter(x=>x.id!=d.i);for(const k in S.l){S.l[k]=S.l[k].filter(x=>x!=d.i);if(!S.l[k].length)delete S.l[k]}save();R()})},
th:d=>{S.th=d.t;save();applyTh();R()},
exp:()=>{const j=JSON.stringify(S);const f=()=>ask('Skopiuj ręcznie:',{v:j},()=>{});navigator.clipboard?navigator.clipboard.writeText(j).then(()=>toast('Skopiowano do schowka'),f):f()},
imp:()=>ask('Wklej kopię danych:',{v:''},j=>{try{S=JSON.parse(j);save();applyTh();R();toast('Wczytano')}catch(e){toast('Błędne dane')}}),
reset:()=>ask('Wybrać nowego zwierzaka? Monety i ubranka zostają.',0,()=>{S.p.k=null;save();V='pet';R()}),
sk:d=>{sk=d.k;R()},cl:d=>{sc=+d.i;R()},
pick:()=>{Object.assign(S.p,{k:sk,ci:sc,n:pn.trim()||NM[sk],ts:Date.now(),full:70});save();PT='home';R()},
pt:d=>{PT=d.t;R()},rn:()=>ask('Imię zwierzaka:',{v:S.p.n,max:16},n=>{if(n.trim()){S.p.n=n.trim().slice(0,16);save();R()}}),
pet:()=>{S.p.love++;save();let s=$('.sceneC'),p=$('#pg');if(!s)return;let h=document.createElement('i');h.className='ht';h.innerHTML=ic('ht',26);h.style.left=40+Math.random()*20+'%';s.appendChild(h);setTimeout(()=>h.remove(),900);p.classList.remove('hop');void p.getBoundingClientRect();p.classList.add('hop');setTimeout(()=>p.classList.remove('hop'),500);$('#lv').textContent=S.p.love},
feed:()=>{if(S.c<5)return toast('Za mało monet, odhacz cele!');S.c-=5;S.p.full=Math.min(100,full()+30);S.p.ts=Date.now();save();R()},
shop:d=>{let x=SHOP.find(i=>i.id==d.i),p=S.p;if(!p.o.includes(x.id)){if(S.c<x.p)return toast('Za mało monet');S.c-=x.p;p.o.push(x.id);p.w[x.s]=x.id}else p.w[x.s]=p.w[x.s]==x.id?null:x.id;save();R()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)act[t.dataset.a](t.dataset)});
document.addEventListener('input',e=>{if(e.target.id=='nn')nn=e.target.value;if(e.target.id=='pn')pn=e.target.value});
$('#nv').innerHTML=[['cal','cl','Kalendarz'],['goals','ch','Cele'],['habits','tg','Postanowienia'],['pet','pw','Zwierzak']].map(([v,i,l])=>`<button data-a=v data-v=${v}>${ic(i)}${l}</button>`).join('');
$('#gb').innerHTML=ic('gr');applyTh();R();
try{matchMedia('(prefers-color-scheme:light)').addEventListener('change',applyTh)}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
